<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Ke Gestão - Gestão e vendas</title>
    <meta name="description" content="Gestão de vendas, estoque e clientes para consultoras de cosméticos. Funciona offline.">
    <meta name="color-scheme" content="light dark">

    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta id="theme-meta-light" name="theme-color" media="(prefers-color-scheme: light)" content="#f43f5e">
    <meta id="theme-meta-dark"  name="theme-color" media="(prefers-color-scheme: dark)"  content="#020617">

    <!-- iOS Specific -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ke Gestão">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="icon" type="image/png" href="/icon-192.png">

    <!-- Android/Generic PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Ke Gestão">

    <script>
      // Aplica o tema antes da primeira pintura (sem piscar). Mesma regra do store:
      // o tema salvo só vale se o usuário o escolheu manualmente; senão, segue o sistema.
      (function () {
        var theme;
        try {
          if (localStorage.getItem('theme_manually_set') === 'true') {
            var saved = JSON.parse(localStorage.getItem('kegestao_v1'));
            theme = saved && saved.profile && saved.profile.theme;
          }
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        var isDark = theme === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        var color = isDark ? '#020617' : '#f43f5e';
        var metaLight = document.getElementById('theme-meta-light');
        var metaDark = document.getElementById('theme-meta-dark');
        if (metaLight) metaLight.setAttribute('content', color);
        if (metaDark) metaDark.setAttribute('content', color);
      })();

      // Captura o beforeinstallprompt o mais cedo possível — o evento dispara uma única
      // vez e geralmente antes do React montar. Sem isso, o prompt é perdido para sempre.
      window.__deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa:installavailable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa:installed'));
      });
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-slate-100 select-none">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
